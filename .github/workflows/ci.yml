# ============================================================================
# 本仓库 CI workflow（wasm 目标）
#
# 本文件是本仓库唯一的 CI 定义，由 push / pull_request / workflow_dispatch 触发。
# 模块是独立 git 仓库，workflow 必须放在模块内 .github/workflows/ 才会被 GitHub Actions 触发。
# 本仓库是独立发布单元，不存在仓库外的 CI 定义或汇总模板。
#
# 五道门禁（顺序执行，任一步非 0 即整 job 失败）：
#   1. moon check --deny-warn
#   2. moon build
#   3. moon test
#   4. moon fmt --check
#   5. moon info && git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti cmd/cli/pkg.generated.mbti
#      （pkg.generated.mbti 快照与源码一致性 fail-closed；cmd/main 与 cmd/cli 下的快照同样纳入 diff 范围。
#        纳入范围 = 本仓库内受版本控制且由 moon info 生成的全部快照，即仓库根、cmd/main、cmd/cli 与 tools/* 各处；
#        pkg.generated.mbti.r1 是历史 R1 基线存档，当前仓库内不存在、也不由 moon info 生成
#        （若本地留有该文件同样不在 diff 范围），.mooncakes/ 下第三方包的
#        快照不受本仓库版本控制，二者均不在 diff 范围。）
# （可选 moon clean：仅清理，continue-on-error，不参与判定）
#
# 工具链版本策略（2026-11-19 修正）：
#   - cli.moonbitlang.com 只提供 latest / nightly：版本化产物
#     `binaries/<版本>/...` 与 `cores/core-<版本>.tar.gz` 一律返回 HTTP 403
#     （2026-11-19 实测 0.1.20261104 与 0.1.20261117 均 403，仅 latest 返回 200），
#     官方安装脚本的 `<版本>` 参数因此不可能成功。
#   - 旧策略「钉死版本 + 回退 latest + 精确版本断言」在逻辑上自相矛盾：latest 一旦
#     前进，断言必然失败（2026-11-19 CI 即因此报 drift）。现改为：
#       1) 显式安装 latest，失败即 fail（不做静默回退）；
#       2) 打印 moon / moonc / moonrun / core 实际版本，供日志追溯；
#       3) 只断言可验证的不变量：moon 来自本次安装目录、三件套均在、core 已安装。
#     版本漂移不再作为硬失败；工具链不兼容由五道门禁的失败暴露。
#
# 本仓库依赖策略：
#   - 禁止无版本 `moon update`：`moon update --help` 实测只有 --target-dir/-q/-v/--trace/--dry-run，
#     没有任何锁定版本的参数，因此 CI 中一律不出现 `moon update`。
#   - 依赖只按各模块 moon.mod 中已钉死的版本声明（例：bobzhang/zip@0.1.2）由 check/build 自动同步。
#   - 如确需显式预取：`moon fetch <author>/<name>@<version> --no-update`（钉死版本且不刷新 registry 元数据）。
#   - 不用 `moon build --frozen`：全新 checkout 没有本地依赖缓存，--frozen 会直接失败。
# ============================================================================
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-gates:
    name: five-gates (axml)
    runs-on: ubuntu-latest
    # 本模块 preferred_target = "wasm"：五道门禁全部在 wasm 后端执行。
    # 本机同序实跑已通过（[已复验-本地等价]），不等同于 GitHub Actions 云上实跑。
    steps:
      - name: Checkout axml
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain installation (moon / moonc / moonrun / core)
        shell: bash
        run: |
          set -euo pipefail
          out="$(moon version --all)"
          echo "$out"
          moon_path="$(command -v moon)"
          if [[ "$moon_path" != "$HOME/.moon/bin/moon" ]]; then
            echo "::error::moon resolves to $moon_path, expected $HOME/.moon/bin/moon (a stale toolchain is earlier on PATH)"
            exit 1
          fi
          for tool in moon moonc moonrun; do
            grep -qE "^$tool " <<<"$out" || {
              echo "::error::$tool missing from 'moon version --all'"
              exit 1
            }
          done
          core_mod="$HOME/.moon/lib/core/moon.mod"
          if [[ ! -f "$core_mod" ]]; then
            echo "::error::missing $core_mod (core not installed)"
            exit 1
          fi
          echo "--- $core_mod ---"
          grep -E '^(name|version) *=' "$core_mod" || true

      # ---- 五道门禁：顺序执行，任一非 0 即失败 ----
      - name: "Gate 1/5 · moon check --deny-warn"
        shell: bash
        run: moon check --deny-warn

      - name: "Gate 2/5 · moon build"
        shell: bash
        run: moon build

      - name: "Gate 3/5 · moon test"
        shell: bash
        run: moon test

      # T-W2-3：fixture 双通道一致性门禁（ASSETS §1 SHA-256 + 内嵌块逐字节，
      # fail-closed；文件缺失不静默跳过）。tools/* 包同为本仓库源码，已被
      # Gate 1-3 一并检查/构建/测试。
      - name: "Gate 3b · fixture consistency (tools/check_fixtures)"
        shell: bash
        run: moon run tools/check_fixtures

      - name: "Gate 4/5 · moon fmt --check"
        shell: bash
        run: moon fmt --check

      - name: "Gate 5/5 · moon info && git diff --exit-code -- pkg.generated.mbti"
        shell: bash
        run: |
          set -euo pipefail
          moon info
          if ! git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti cmd/cli/pkg.generated.mbti tools/check_fixtures/pkg.generated.mbti tools/genconfig/pkg.generated.mbti; then
            echo "::error::Gate 5/5 failed: pkg.generated.mbti snapshot out of sync with sources. Run 'moon info' locally and commit the regenerated snapshot together with the API change (additive changes also require a regenerated snapshot and an API-change note in this repository's docs/API.md)."
            exit 1
          fi
          echo "Gate 5/5 OK: snapshot in sync (pkg.generated.mbti + cmd/main/pkg.generated.mbti + cmd/cli/pkg.generated.mbti + tools/*/pkg.generated.mbti)"

      - name: "Optional · moon clean (not a gate)"
        shell: bash
        continue-on-error: true
        run: moon clean

  # L5 双目标等价门禁：与默认 wasm 同一套用例在 native 后端复跑。
  # 等价口径 = 同一 moon test 全绿（本仓库测试无 target 分支逻辑）。
  l5-native:
    name: l5-dual-target (native moon test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout axml
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: "L5 · moon test --target native (same suite as wasm gate)"
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon test --target native
